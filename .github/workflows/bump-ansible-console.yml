# Keep Casks/ansible-console.rb on the newest Latest release of the binaries repo.
# Releases are published from a private build machine that cannot push here (deploy keys are
# off for the org, no cross-repo token), so this repo bumps itself with its own GITHUB_TOKEN
# (the binaries repo is public): on demand (`gh workflow run bump-ansible-console.yml -R
# couplet-physical-ai/homebrew-tap -f version=V`) and every 20 minutes. Forward only; Latest
# only (a prerelease never moves the cask). Every name lives in the env block below.
name: bump-ansible-console
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v (empty = the Latest release)"
        required: false
  schedule:
    - cron: "*/20 * * * *"
permissions:
  contents: write
concurrency:
  group: bump-ansible-console
  cancel-in-progress: false
env:
  BIN_REPO: couplet-physical-ai/ansible-console
  ZIP_PREFIX: Ansible-
  ZIP_SUFFIX: -arm64.zip
  CASK_FILE: Casks/ansible-console.rb
  CASK_NAME: ansible-console
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ -f "$CASK_FILE" ]] || { echo "$CASK_FILE missing"; exit 1; }
          if [[ -n "${WANT:-}" ]]; then tag="v${WANT#v}"; else
            tag=$(gh release view -R "$BIN_REPO" --json tagName --jq .tagName 2>/dev/null) || { echo "no Latest release yet"; exit 0; }
          fi
          # Latest only: a prerelease (gated, placeholder) never moves the cask.
          pre=$(gh release view "$tag" -R "$BIN_REPO" --json isPrerelease --jq .isPrerelease)
          if [[ "$pre" == true ]]; then echo "$tag is a prerelease; leaving the cask"; exit 0; fi
          v=${tag#v}
          zip="${ZIP_PREFIX}${v}${ZIP_SUFFIX}"
          gh release download "$tag" -R "$BIN_REPO" -p SHA256SUMS -O /tmp/SHA256SUMS
          sha=$(awk -v f="$zip" '$2==f {print $1}' /tmp/SHA256SUMS)
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "no sha256 for $zip in $tag's SHA256SUMS"; exit 1; }
          # Never trust SHA256SUMS alone: hash the asset itself.
          gh release download "$tag" -R "$BIN_REPO" -p "$zip" -O /tmp/app.zip
          real=$(sha256sum /tmp/app.zip | cut -d' ' -f1)
          [[ "$real" == "$sha" ]] || { echo "SHA256SUMS says $sha, the asset is $real"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Bump the cask
        if: steps.rel.outputs.version != ''
        env:
          V: ${{ steps.rel.outputs.version }}
          SHA: ${{ steps.rel.outputs.sha }}
        run: |
          set -euo pipefail
          f=$CASK_FILE
          cur=$(sed -nE 's/^  version "([^"]+)"/\1/p' "$f")
          if [[ "$cur" == "$V" ]] && grep -q "sha256 \"$SHA\"" "$f"; then echo "cask already at $V"; exit 0; fi
          # Forward only, a manual dispatch included.
          if [[ "$(printf '%s\n%s\n' "$cur" "$V" | sort -V | tail -1)" != "$V" ]]; then
            echo "release $V is older than the cask's $cur; leaving it"; exit 0; fi
          sed -i -E "s/^  version \"[^\"]+\"/  version \"$V\"/; s/^  sha256 \"[0-9a-f]+\"/  sha256 \"$SHA\"/" "$f"
          ruby -c "$f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "$CASK_NAME $V"
          git push -q origin HEAD:main
          echo "bumped $CASK_NAME $cur -> $V ($(git rev-parse --short HEAD))"
